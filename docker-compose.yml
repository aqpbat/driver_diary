name: driver-diary

# Local development stack. Credentials below are for local use only;
# on Railway the API gets DATABASE_URL from the managed Postgres service.

services:
  db:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: diary
      POSTGRES_PASSWORD: diary
      POSTGRES_DB: diary
      TZ: UTC
    volumes:
      # Postgres 18+ keeps its data under /var/lib/postgresql/<major>, so the
      # volume goes on the parent directory, not on .../data.
      - pgdata:/var/lib/postgresql
    ports:
      # Published on loopback only: used by `go test` and psql from the host.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diary -d diary"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./api
    image: driver-diary-api:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      APP_TZ: Asia/Almaty
      TRIPS_FILE: /data/trips.json
      DATABASE_URL: postgres://diary:diary@db:5432/diary?sslmode=disable
      CORS_ALLOWED_ORIGINS: "*"
    volumes:
      # Seed data is mounted read-only so it can be edited without a rebuild.
      # It is loaded only into an empty database: `docker compose down -v` resets.
      - ./api/data/trips.json:/data/trips.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      # The runtime image has no shell or curl; the binary probes itself.
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
