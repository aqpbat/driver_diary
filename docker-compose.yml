name: driver-diary

services:
  api:
    build:
      context: ./api
    image: driver-diary-api:local
    environment:
      PORT: "8080"
      APP_TZ: Asia/Almaty
      TRIPS_FILE: /data/trips.json
      CORS_ALLOWED_ORIGINS: "*"
    volumes:
      # Seed data is mounted read-only so it can be edited without a rebuild.
      - ./api/data/trips.json:/data/trips.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      # The runtime image has no shell or curl; the binary probes itself.
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
