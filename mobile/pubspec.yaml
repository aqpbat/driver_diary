name: driver_app_demo
description: "Дневник смен водителя: сводка за день, список поездок, добавление поездки."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4
  flutter: 3.47.5

# Exact versions on purpose (no ^): see CLAUDE.md, "Toolchain".
dependencies:
  flutter:
    sdk: flutter
  bloc_concurrency: 0.3.0
  equatable: 3.0.0
  flutter_bloc: 9.1.1
  http: 1.6.0
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: 10.0.0
  flutter_lints: 6.0.0
  mocktail: 1.0.5

flutter:
  uses-material-design: false
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest.ttf
